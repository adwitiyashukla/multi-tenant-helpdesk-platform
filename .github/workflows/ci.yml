name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://helpdesk:helpdesk@127.0.0.1:5432/helpdesk
  TEST_DATABASE_URL: postgres://helpdesk:helpdesk@127.0.0.1:5432/helpdesk_test
  REDIS_URL: redis://127.0.0.1:6379
  SESSION_SECRET: ci_session_secret_value_32_characters
  INBOUND_EMAIL_SECRET: ci_inbound_secret
  INBOUND_EMAIL_DOMAIN: inbox.test
  API_PORT: 4000
  API_HOST: 127.0.0.1
  WEB_ORIGIN: http://127.0.0.1:3000
  NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
  NEXT_PUBLIC_WS_URL: ws://127.0.0.1:4000/ws
  E2E_BASE_URL: http://127.0.0.1:3000
  LOG_LEVEL: warn

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helpdesk/web build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helpdesk/mobile bundle

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @helpdesk/web exec playwright install --with-deps chromium
      - run: pnpm --filter @helpdesk/api build
      - run: pnpm --filter @helpdesk/web build
      - name: start api and web
        run: |
          pnpm --filter @helpdesk/api start &
          pnpm --filter @helpdesk/web start &
          npx wait-on http://127.0.0.1:4000/health http://127.0.0.1:3000/login --timeout 90000
      - run: pnpm test:e2e
